name: Build APK

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Also build a signed release APK and AAB (requires signing secrets)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      # Tag builds use the tag (v1.2.0 -> 1.2.0); other builds use 0.1.<run number>
      APP_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web game
        run: bun run build

      - name: Copy web build into the Android project
        run: bunx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --init-script ../.github/gradle/central-mirror.gradle

      - name: Rename debug APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/footgolf-pro-${APP_VERSION_NAME#v}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: footgolf-pro-debug-apk
          path: out/*-debug.apk
          if-no-files-found: error

      # Release builds run on main, tags, and manual runs, and only when signing secrets exist.
      - name: Decode signing keystore
        if: env.HAS_SIGNING_KEY == 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.release)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: env.ANDROID_KEYSTORE_PATH != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --init-script ../.github/gradle/central-mirror.gradle

      - name: Collect release outputs
        if: env.ANDROID_KEYSTORE_PATH != ''
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "out/footgolf-pro-${APP_VERSION_NAME#v}-release.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/footgolf-pro-${APP_VERSION_NAME#v}-release.aab"
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload release APK and AAB
        if: env.ANDROID_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: footgolf-pro-release
          path: |
            out/*-release.apk
            out/*-release.aab
          if-no-files-found: error

      - name: Note missing signing secrets
        if: env.HAS_SIGNING_KEY != 'true' && github.event_name != 'pull_request'
        run: echo "::notice::Signing secrets are not set, so only the debug APK was built. See docs/ANDROID.md to add them."

      - name: Attach APKs to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
